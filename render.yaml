databases:
  - name: skin-care-centre-db
    databaseName: skin_care_centre
    user: skin_care_centre

services:
  - type: web
    name: skin-care-centre-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skin-care-centre-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN_REGEX
        value: "https://your-frontend-domain\\.com"
